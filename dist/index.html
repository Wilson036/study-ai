<script>
"use strict";
const APP_VERSION="1.3.1", SCHEMA_MIN=2, SCHEMA_MAX=2, DB_NAME="ai-planner-study", DB_VERSION=1;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function deploymentConfig(source=globalThis.STUDY_APP_CONFIG){const raw=source||{};return{url:String(raw.supabaseUrl||"").trim().replace(/\/$/,""),key:String(raw.supabasePublishableKey||raw.supabaseAnonKey||"").trim()}}
function configReady(config){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(config?.url||"")&&!!config?.key&&!/REPLACE_ME|YOUR_/i.test(config.key)}
function parseRecoverySession(hash=globalThis.location?.hash||""){const p=new URLSearchParams(String(hash).replace(/^#/,""));if(p.get("type")!=="recovery"||!p.get("access_token"))return null;return{access_token:p.get("access_token"),refresh_token:p.get("refresh_token")||"",expires_at:Number(p.get("expires_at"))||Math.floor(Date.now()/1000)+Number(p.get("expires_in")||3600),token_type:p.get("token_type")||"bearer",type:"recovery"}}
const app={db:null,config:deploymentConfig(),session:null,profile:null,partition:null,settings:{timezone:"Asia/Taipei",newPerDay:12,perSession:20},conceptReviews:new Map(),concepts:new Map(),bank:[],events:[],derived:new Map(),queue:[],position:0,current:null,presentation:null,selected:null,revealed:false,hintLevel:0,submitted:false,sessionRepeat:new Set(),syncIncomplete:false,swReg:null,authMode:"login",browseChapter:null,browseQuery:""};
const outcomeRank={clean:0,near:1,wrong:2}, intervals={0:1,1:1,2:3,3:7,4:21,5:60};
function toast(message){const el=$("#toast");el.textContent=message;el.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add("hidden"),3200)}
function error(message){$("#globalError").innerHTML=message?`<div class="error">${escapeHtml(message)}</div>`:""}
function syncMessage(message){const el=$("#syncDetail");if(el)el.textContent=message}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uuid(){return crypto.randomUUID()}
function addDays(day,n){const [y,m,d]=day.split("-").map(Number),dt=new Date(Date.UTC(y,m-1,d+n));return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`}
function studyDay(now=new Date(),tz=app.settings.timezone){const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"}).formatToParts(now).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));let day=`${parts.year}-${parts.month}-${parts.day}`;if(Number(parts.hour)<4)day=addDays(day,-1);return day}
function dayOutcome(events){return events.reduce((worst,e)=>outcomeRank[e.outcome]>outcomeRank[worst]?e.outcome:worst,"clean")}
function deriveItem(events){const days=new Map;for(const e of events){if(!days.has(e.study_day))days.set(e.study_day,[]);days.get(e.study_day).push(e)}let level=0,due=null;const outcomes=[...days].map(([day,es])=>({day,outcome:dayOutcome(es)})).sort((a,b)=>a.day.localeCompare(b.day));for(const x of outcomes){if(x.outcome==="wrong"){level=0;due=addDays(x.day,1)}else if(x.outcome==="near")due=addDays(x.day,intervals[level]||1);else{level=Math.min(5,level+1);due=addDays(x.day,intervals[level])}}const lapseDays=outcomes.filter(x=>x.outcome==="wrong").map(x=>x.day),lastLapse=lapseDays.at(-1)||null,successDays=outcomes.filter(x=>x.outcome==="clean"&&(!lastLapse||x.day>lastLapse)).map(x=>x.day);return{level,due,lapseDays,lastLapse,successDays,inMistakes:!!lastLapse&&successDays.length<2,outcomes}}
function deriveAll(events){const grouped=new Map;for(const e of events){if(!grouped.has(e.item_id))grouped.set(e.item_id,[]);grouped.get(e.item_id).push(e)}return new Map([...grouped].map(([id,es])=>[id,deriveItem(es)]))}
function normalizeAnswer(s){return String(s??"").normalize("NFKC").toLocaleLowerCase().replace(/[\s\p{P}\p{S}]/gu,"")}
function editDistance(a,b){const row=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return row[b.length]}
function judge(input,q){const got=normalizeAnswer(input),accepted=[q.answer,...(q.accept||[])].map(normalizeAnswer);if(accepted.includes(got))return"clean";if(/^[a-z]+$/i.test(got)&&got.length>=5&&accepted.some(x=>/^[a-z]+$/i.test(x)&&editDistance(got,x)<=1))return"near";return"wrong"}
function groupConcepts(items){const groups=new Map;for(const q of items.filter(x=>!x.tombstoned)){if(!groups.has(q.conceptId))groups.set(q.conceptId,{conceptId:q.conceptId,primary:q,items:[]});const group=groups.get(q.conceptId);group.items.push(q);if((q.explanation?.length||0)>(group.primary.explanation?.length||0))group.primary=q}return[...groups.values()]}
function request(store,mode="readonly"){return app.db.transaction(store,mode).objectStore(store)}
function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("transaction aborted"))})}
async function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;const events=db.createObjectStore("events",{keyPath:"key"});events.createIndex("partition","partition");const meta=db.createObjectStore("localMeta",{keyPath:"key"});meta.createIndex("partition","partition");meta.createIndex("partitionConfirmed",["partition","confirmed"]);meta.createIndex("presentationSignal",["partition","presentationId","signal"],{unique:true});const out=db.createObjectStore("outbox",{keyPath:"key"});out.createIndex("partition","partition");db.createObjectStore("profiles",{keyPath:"partition"});db.createObjectStore("settings",{keyPath:"key"});const banks=db.createObjectStore("banks",{keyPath:"key"});banks.createIndex("partition","partition");db.createObjectStore("pointers",{keyPath:"partition"});db.createObjectStore("locks",{keyPath:"name"});db.createObjectStore("divergence",{keyPath:"seq",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function allByPartition(store){if(!app.partition)return[];return req(request(store).index("partition").getAll(app.partition))}
async function loadBootstrap(){app.config=deploymentConfig();const ref=projectRef(),profiles=(await req(request("profiles").getAll())).filter(x=>x.projectRef===ref);if(profiles.length){app.profile=profiles.sort((a,b)=>(b.lastUsed||"").localeCompare(a.lastUsed||""))[0];app.partition=app.profile.partition;await loadPartition()}}
async function loadPartition(){const set=await req(request("settings").get(`partition:${app.partition}`));if(set)app.settings={...app.settings,...set.value};const reviews=await req(request("settings").get(`conceptReviews:${app.partition}`));app.conceptReviews=new Map(Object.entries(reviews?.value||{}));app.events=(await allByPartition("events")).map(x=>x.payload);app.derived=deriveAll(app.events);await loadBank();renderAll()}
async function loadBank(){if(!app.partition)return;const tx=app.db.transaction(["pointers","banks"],"readonly"),pointer=await req(tx.objectStore("pointers").get(app.partition));if(pointer){const bank=await req(tx.objectStore("banks").get(`${app.partition}:${pointer.activeBankVersion}`));if(bank){app.bank=bank.items;app.concepts=new Map((bank.concepts||[]).map(x=>[x.id,x]))}}await txDone(tx)}
async function saveConceptReviews(){if(!app.partition)return;await req(request("settings","readwrite").put({key:`conceptReviews:${app.partition}`,value:Object.fromEntries(app.conceptReviews)}))}
async function setConceptReviewed(conceptId,reviewed){if(!app.partition){openAuth("login");return}app.conceptReviews.set(conceptId,{reviewed,reviewedAt:reviewed?new Date().toISOString():null,dirty:true});await saveConceptReviews();renderSummary();$("#browse").classList.contains("active")?renderBrowse():renderReviewSummary();if(app.session&&navigator.onLine)syncConceptReviews().catch(e=>toast(`複習勾選待同步：${e.message}`))}
async function persistEvent(itemId,presentationId,signal,outcome,extra={}){if(!app.partition)throw new Error("請先登入並下載題庫，才能安全保存進度");const tx=app.db.transaction(["events","localMeta","outbox"],"readwrite"),metaStore=tx.objectStore("localMeta"),idx=metaStore.index("presentationSignal"),existing=await req(idx.get([app.partition,presentationId,signal]));if(existing){await txDone(tx);return existing.event_id}const event_id=uuid(),payload={event_id,user_id:app.profile.userId,item_id:itemId,study_day:studyDay(),outcome,hint_level:extra.hintLevel||0,revealed:!!extra.revealed,first_attempt:extra.firstAttempt!==false,client_ts:new Date().toISOString()};const key=`${app.partition}:${event_id}`;tx.objectStore("events").put({key,partition:app.partition,payload});metaStore.put({key,partition:app.partition,event_id,presentationId,signal,confirmed:false});tx.objectStore("outbox").put({key,partition:app.partition,event_id,payload});await txDone(tx);app.events.push(payload);app.derived=deriveAll(app.events);return event_id}
async function signalGate(write,after){await write();after()}
async function safeSignal(signal,outcome,extra,after){try{await signalGate(()=>persistEvent(app.current.id,app.presentation,signal,outcome,extra),after);renderSummary()}catch(e){toast("本次作答尚未安全保存");throw e}}
function buildQueue(){const today=studyDay(),usedConcepts=new Set,conceptLapse=new Map;for(const q of app.bank){const lapse=app.derived.get(q.id)?.lastLapse;if(lapse&&(!conceptLapse.get(q.conceptId)||lapse>conceptLapse.get(q.conceptId)))conceptLapse.set(q.conceptId,lapse)}let due=[],fresh=[];for(const q of app.bank.filter(x=>!x.tombstoned)){const s=app.derived.get(q.id),siblingCooling=!s&&conceptLapse.has(q.conceptId)&&addDays(conceptLapse.get(q.conceptId),2)>today;if(siblingCooling)continue;if(s&&s.due&&s.due<=today)due.push(q);else if(!s)fresh.push(q)}due.sort((a,b)=>(app.derived.get(a.id)?.due||"").localeCompare(app.derived.get(b.id)?.due||""));fresh.sort((a,b)=>(b.importance||0)-(a.importance||0)||(a.difficulty||0)-(b.difficulty||0));const picked=[];for(const q of due){if(picked.length>=app.settings.perSession)break;if(!usedConcepts.has(q.conceptId)){picked.push(q);usedConcepts.add(q.conceptId)}}let addedNew=0;for(const q of fresh){if(picked.length>=app.settings.perSession||addedNew>=app.settings.newPerDay)break;if(!usedConcepts.has(q.conceptId)){picked.push(q);usedConcepts.add(q.conceptId);addedNew++}}return picked}
function startSession(){if(!app.bank.length){openAuth("login");toast("請先登入並下載題庫");return}app.queue=buildQueue();app.position=0;app.sessionRepeat.clear();if(!app.queue.length){toast("今天都完成了，做得很好");return}go("practice");showQuestion()}
function showQuestion(){app.current=app.queue[app.position];app.presentation=uuid();app.selected=null;app.revealed=false;app.hintLevel=0;app.submitted=false;if(!app.current){finishSession();return}renderQuestion()}
function renderQuestion(){const q=app.current,total=app.queue.length;if(!q)return;$("#qChapter").textContent=`${q.chapter}・${q.page}`;$("#progressbar").style.width=`${Math.round(app.position/Math.max(1,total)*100)}%`;let answer=q.type==="cloze"?`<input class="answer-input" id="answer" autocomplete="off" placeholder="輸入你想起的答案" aria-label="答案">`:`<div class="choices">${choicesFor(q).map((c,i)=>`<button class="choice" data-choice="${i}"><b>${i+1}.</b> ${escapeHtml(c)}</button>`).join("")}</div>`;$("#practiceBody").innerHTML=`<div class="eyebrow">第 ${app.position+1} / ${total} 題・${q.type==="cloze"?"填空":q.type==="mcq"?"選擇":"配對"}</div><div class="prompt">${escapeHtml(q.prompt)}</div>${answer}<div class="warning">按提示後，今天這題最高只算「模糊」；揭答後會算答錯。</div><div class="actions"><button class="primary" id="submitAnswer">送出 <span class="kbd">Enter</span></button><button class="secondary" id="hint">提示 <span class="kbd">H</span></button><button class="ghost" id="reveal">揭答 <span class="kbd">Space</span></button></div><div id="feedback"></div>`;$$('[data-choice]').forEach(b=>b.onclick=()=>{$$('[data-choice]').forEach(x=>x.classList.remove("selected"));b.classList.add("selected");app.selected=Number(b.dataset.choice)});$("#submitAnswer").onclick=submitAnswer;$("#hint").onclick=showHint;$("#reveal").onclick=revealAnswer;$("#answer")?.focus()}
function choicesFor(q){if(q.type==="mcq")return q.choices;const others=app.bank.filter(x=>x.type==="match"&&x.chapter===q.chapter&&x.id!==q.id).slice(0,3).map(x=>x.right);const result=[q.right,...others];return result.sort((a,b)=>((a.charCodeAt(0)+q.id.length)%7)-((b.charCodeAt(0)+q.id.length)%7))}
async function showHint(){if(app.submitted||app.hintLevel>=Math.min(3,app.current.hints?.length||1))return;await safeSignal(`hint-${app.hintLevel+1}`,"near",{hintLevel:app.hintLevel+1},()=>{app.hintLevel++;const hint=app.current.hints?.[app.hintLevel-1]||`想想「${app.current.chapter}」的核心用途。`;$("#feedback").innerHTML=`<div class="feedback">提示：${escapeHtml(hint)}</div>`})}
async function revealAnswer(){if(app.submitted||app.revealed)return;await safeSignal("reveal","wrong",{revealed:true,hintLevel:app.hintLevel},()=>{app.revealed=true;app.submitted=true;showFeedback("wrong")})}
async function submitAnswer(){if(app.submitted)return;const q=app.current;let outcome;if(q.type==="cloze")outcome=judge($("#answer").value,q);else if(app.selected===null){toast("請先選一個答案");return}else outcome=choicesFor(q)[app.selected]=== (q.type==="mcq"?q.choices[q.answerIndex]:q.right)?"clean":"wrong";if(app.hintLevel&&outcome==="clean")outcome="near";await safeSignal("submit",outcome,{hintLevel:app.hintLevel,revealed:false,firstAttempt:true},()=>{app.submitted=true;showFeedback(outcome)})}
function showFeedback(outcome){const q=app.current,good=outcome==="clean";if(outcome==="wrong"&&!app.sessionRepeat.has(q.id)){app.queue.push(q);app.sessionRepeat.add(q.id)}$("#feedback").innerHTML=`<div class="feedback ${good?"":"bad"}"><strong>${good?"完整想起來了":"這次先留個記號"}</strong><p>正解：${escapeHtml(q.answer)}</p><p>${escapeHtml(q.explanation)}</p><div class="source">${escapeHtml(q.chapter)}・${escapeHtml(q.page)}<br>「${escapeHtml(q.sourceQuote)}」</div><p><small>這次體感（只影響本輪是否再排，不改分數）</small></p><div class="actions"><button class="secondary" data-rate="recalled">想起了</button><button class="secondary" data-rate="fuzzy">模糊</button><button class="secondary" data-rate="forgot">沒想起</button><button class="primary" id="next">下一題 <span class="kbd">Enter</span></button></div></div>`;$("#next").onclick=nextQuestion;$$('[data-rate]').forEach(b=>b.onclick=()=>{if(b.dataset.rate!=="recalled"&&!app.sessionRepeat.has(q.id)){app.queue.push(q);app.sessionRepeat.add(q.id)}$$('[data-rate]').forEach(x=>x.disabled=true);toast("只調整本輪隊列，客觀分數不變")})}
function nextQuestion(){if(!app.submitted)return;app.position++;showQuestion()}
async function finishSession(){app.current=null;$("#practiceBody").innerHTML=`<div class="empty"><h2>這一輪完成了</h2><p>進度已安全存到這台裝置；連線時會自動同步。</p><button class="primary" data-go="today">回到今日</button></div>`;$("#progressbar").style.width="100%";bindGo();renderAll();if(app.session)sync().catch(()=>{})}
function renderSummary(){app.derived=deriveAll(app.events);const today=studyDay(),due=app.bank.filter(q=>{const s=app.derived.get(q.id);return !s||s.due<=today}).length,mistakes=[...app.derived.values()].filter(x=>x.inMistakes).length,reviewPending=[...app.conceptReviews.values()].filter(x=>x.dirty).length;$("#dueBig").textContent=due;$("#dueCount").textContent=app.bank.filter(q=>app.derived.get(q.id)?.due<=today).length;$("#wrongCount").textContent=mistakes;allByPartition("outbox").then(x=>{$("#pendingCount").textContent=x.length+reviewPending});const studyDays=[...new Set(app.events.map(x=>x.study_day))].sort().reverse();let streak=0,cursor=today;for(const d of studyDays){if(d===cursor){streak++;cursor=addDays(cursor,-1)}else if(d<cursor)break}$("#streak").textContent=`${streak} 天`;const days=app.bank.length?Math.ceil(app.bank.length/app.settings.newPerDay):0,txt=days?`以每日 ${app.settings.newPerDay} 題新題計算，全部 ${app.bank.length} 題預計 ${days} 天走完第一輪`:"載入題庫後顯示首輪估計";$("#estimate").textContent=txt;$("#profileText").textContent=app.session&&app.profile?.email?app.profile.email:"尚未登入"}
function startMistakeReview(itemId){const q=app.bank.find(x=>x.id===itemId);if(!q)return;app.queue=[q];app.position=0;app.sessionRepeat.clear();go("practice");showQuestion()}
function renderMistakes(){const list=app.bank.filter(q=>app.derived.get(q.id)?.inMistakes);$("#mistakeList").innerHTML=list.length?list.map(q=>{const s=app.derived.get(q.id),left=Math.max(0,2-s.successDays.length);return`<article class="mistake-card"><div class="mistake-top"><div class="mistake-question">${escapeHtml(q.prompt)}</div><span class="mistake-badge">還需 ${left} 個成功日</span></div><div class="mistake-answer">正確答案：${escapeHtml(q.answer)}</div><div class="mistake-explain">${escapeHtml(q.explanation)}</div><div class="mistake-actions"><small>${escapeHtml(q.chapter)}・${escapeHtml(q.page)}${s.lastLapse?`　最近答錯：${escapeHtml(s.lastLapse)}`:""}</small><button class="secondary" data-mistake-review="${escapeHtml(q.id)}">重新練習</button></div></article>`}).join(""):`<div class="empty"><h3>目前沒有錯題</h3><p>完成自我測驗後，答錯的題目會自動出現在這裡。</p></div>`;$$('[data-mistake-review]').forEach(x=>x.onclick=()=>startMistakeReview(x.dataset.mistakeReview))}
function renderReviewSummary(){const concepts=groupConcepts(app.bank),reviewed=concepts.filter(x=>app.conceptReviews.get(x.conceptId)?.reviewed).length;$("#reviewSummary").innerHTML=concepts.length?`<strong>已複習 ${reviewed} / ${concepts.length} 個觀念</strong><span>${concepts.length-reviewed} 個待確認</span>`:`<span>登入後載入觀念與複習進度</span>`}
function renderBrowse(){
  const conceptList=groupConcepts(app.bank),chapters=new Map;
  for(const group of conceptList){const q=group.primary,key=`${q.subject}|${q.chapter}`;if(!chapters.has(key))chapters.set(key,{key,label:`科目 ${q.subject}｜${q.chapter}`,subject:q.subject,groups:[]});chapters.get(key).groups.push(group)}
  renderReviewSummary();
  if(!chapters.size){$("#browseTree").innerHTML=`<div class="panel empty">登入後下載題庫，就能看到完整學習筆記。</div>`;return}

async function updateBank(){if(!app.session)throw new Error("需登入才能下載私有題庫");const work=async fenceOwner=>{const manifest=JSON.parse(new TextDecoder().decode(await storageBytes("manifest.json")));if(!Number.isInteger(manifest.bankVersion)||manifest.schemaVersion<SCHEMA_MIN||manifest.schemaVersion>SCHEMA_MAX)throw new Error("題庫格式超出支援範圍，請重新上傳最新版題庫");const pointer=await req(request("pointers").get(app.partition));if(pointer&&manifest.bankVersion<=pointer.activeBankVersion){await loadBank();return}const bytes=await storageBytes("questions.json"),hash=await sha256(bytes);if(hash!==manifest.sha256)throw new Error("題庫完整性驗證失敗");const items=JSON.parse(new TextDecoder().decode(bytes));if(items.length!==manifest.itemCount)throw new Error("題庫題數與 manifest 不符");const conceptBytes=await storageBytes("concepts.json"),conceptHash=await sha256(conceptBytes);if(conceptHash!==manifest.conceptSha256)throw new Error("觀念資料完整性驗證失敗");const concepts=JSON.parse(new TextDecoder().decode(conceptBytes));if(concepts.length!==manifest.conceptCount)throw new Error("觀念數與 manifest 不符");const conceptIds=new Set(concepts.map(x=>x.id));for(const item of items)if(!conceptIds.has(item.conceptId))throw new Error(`題目缺少觀念資料 ${item.conceptId}`);const ids=new Set(items.map(x=>x.id)),history=new Set(app.events.map(x=>x.item_id));for(const id of history)if(!ids.has(id))throw new Error(`新版題庫缺少歷史題目 ${id}`);const stores=fenceOwner?["banks","pointers","locks"]:["banks","pointers"],tx=app.db.transaction(stores,"readwrite"),current=await req(tx.objectStore("pointers").get(app.partition));if(fenceOwner){const lock=await req(tx.objectStore("locks").get("bank-switch"));if(!lock||lock.owner!==fenceOwner||lock.expiresAt<Date.now()){tx.abort();throw new Error("題庫更新鎖已過期，放棄切換")}}if(current&&manifest.bankVersion<=current.activeBankVersion){tx.abort();return}tx.objectStore("banks").put({key:`${app.partition}:${manifest.bankVersion}`,partition:app.partition,version:manifest.bankVersion,items,concepts});tx.objectStore("pointers").p
